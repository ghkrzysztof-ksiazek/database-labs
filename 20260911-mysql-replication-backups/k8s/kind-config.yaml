kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mysql-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30306
        hostPort: 3307
        protocol: TCP
      - containerPort: 30300
        hostPort: 3001
