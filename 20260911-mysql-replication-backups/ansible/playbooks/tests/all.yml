---
# Ordered backup/restore/PITR suite. Order is load-bearing: every restore
# needs a good backup behind it, and destructive scenarios must not strand
# the lab. Run with: ./scripts/lab.sh test-backups
- name: MySQL backup, restore and PITR suite
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
    kubeconfig_path: "{{ (playbook_dir ~ '/../../..') | realpath }}/.kube/config"
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ lookup('env', 'PATH') }}"
    KUBECONFIG: "{{ (playbook_dir ~ '/../../..') | realpath }}/.kube/config"
  roles:
    - test_common
  tasks:
    - block:
        - ansible.builtin.include_role:
            name: t01_backup_full
        - ansible.builtin.include_role:
            name: t02_backup_from_replica
        - ansible.builtin.include_role:
            name: t03_backup_incremental
        - ansible.builtin.include_role:
            name: t04_storage_contents
        - ansible.builtin.include_role:
            name: t05_backup_scheduled
        - ansible.builtin.include_role:
            name: t06_backup_retention
        - ansible.builtin.include_role:
            name: t07_restore_in_place
        - ansible.builtin.include_role:
            name: t08_restore_dropped_table
        - ansible.builtin.include_role:
            name: t09_pitr_timestamp
        - ansible.builtin.include_role:
            name: t10_pitr_gtid
        - ansible.builtin.include_role:
            name: t11_pitr_invalid_target
        - ansible.builtin.include_role:
            name: t12_restore_as_replica
      always:
        - ansible.builtin.include_role:
            name: test_report
