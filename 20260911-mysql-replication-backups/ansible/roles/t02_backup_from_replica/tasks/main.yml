---
- name: Start the t02 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - name: Gate on cluster health before t02
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Find a read-only replica to back up from
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG="{{ kubeconfig_path }}"
        NS="{{ mysql_namespace }}"
        for p in $(kubectl -n "$NS" get pods -l app.kubernetes.io/instance={{ mysql_cluster_name }},app.kubernetes.io/component=database \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort); do
          ro=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e "SELECT @@read_only" 2>/dev/null | tr -d '\r')
          if [ "$ro" = "1" ]; then echo "$p"; exit 0; fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: replica_pod
      changed_when: false

    - name: Remove any stale t02 backup object
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLBackup
        namespace: "{{ mysql_namespace }}"
        name: t02-replica
        wait: true
        wait_timeout: 180

    - name: Request a full backup sourced from the replica
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: ps.percona.com/v1
          kind: PerconaServerMySQLBackup
          metadata:
            name: t02-replica
            namespace: "{{ mysql_namespace }}"
          spec:
            clusterName: "{{ mysql_cluster_name }}"
            storageName: "{{ backup_storage_name }}"
            type: full
            sourcePod: "{{ replica_pod.stdout | trim }}"

    - name: Confirm the primary stayed writable during the replica backup
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG="{{ kubeconfig_path }}"
        kubectl -n {{ mysql_namespace }} exec {{ mysql_cluster_name }}-mysql-0 -c mysql -- \
          mysql -uroot -p{{ mysql_root_password }} -N -e \
          "CREATE TABLE IF NOT EXISTS {{ sysbench_database }}.t02_writes (id INT AUTO_INCREMENT PRIMARY KEY, at DATETIME);
           INSERT INTO {{ sysbench_database }}.t02_writes (at) VALUES (UTC_TIMESTAMP());
           SELECT CONCAT('PRIMARY_WRITABLE=', IF(@@read_only=0,'yes','no'));
           SELECT CONCAT('PRIMARY_WRITES=', COUNT(*)) FROM {{ sysbench_database }}.t02_writes;" | tr -d '\r'
      args:
        executable: /bin/bash
      register: primary_writes
      changed_when: true

    - name: Wait for the replica-sourced backup to finish
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLBackup
        namespace: "{{ mysql_namespace }}"
        name: t02-replica
      register: t02_bkp
      until:
        - t02_bkp.resources | length == 1
        - (t02_bkp.resources[0].status.state | default('') | lower)
          in ['succeeded', 'ready', 'done', 'failed', 'error']
      retries: 120
      delay: 10

    - name: Require a successful backup taken off the replica
      ansible.builtin.assert:
        that:
          - (t02_bkp.resources[0].status.state | default('') | lower) in ['succeeded', 'ready', 'done']
          - backup_bucket in (t02_bkp.resources[0].status.destination | default(''))
          - (replica_pod.stdout | trim) != (mysql_cluster_name ~ '-mysql-0')
          - "'PRIMARY_WRITABLE=yes' in primary_writes.stdout"
        fail_msg: >-
          Replica-sourced backup failed: pod={{ replica_pod.stdout | trim }}
          status={{ t02_bkp.resources[0].status | default({}) }}

    - name: Record t02 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t02
        scenario_title: Backup taken from the replica, primary untouched
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: >-
          {{ ['SOURCE_POD=' ~ (replica_pod.stdout | trim)]
             + ['BACKUP_STATE=' ~ t02_bkp.resources[0].status.state]
             + ['BACKUP_DESTINATION=' ~ (t02_bkp.resources[0].status.destination | default('n/a'))]
             + ['BACKUP_COMPLETED=' ~ (t02_bkp.resources[0].status.completed | default('n/a'))]
             + primary_writes.stdout_lines }}

  rescue:
    - name: Record t02 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t02
        scenario_title: Backup taken from the replica, primary untouched
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ansible_failed_result.msg | default('see play output') | string | split('\n') }}"

    - name: Fail the play after recording t02
      ansible.builtin.fail:
        msg: "t02 failed: {{ ansible_failed_result.msg | default('see above') }}"
