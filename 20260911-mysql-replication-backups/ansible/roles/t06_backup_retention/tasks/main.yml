---
- name: Start the t06 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - block:
        - name: Gate on cluster health before t06
          ansible.builtin.include_role:
            name: test_common
            tasks_from: health_gate.yml

        - name: Save the actual backup schedule before testing retention
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
          register: t06_cluster_before

        - name: Preserve the prior backup schedule
          ansible.builtin.set_fact:
            t06_prior_schedule: "{{ t06_cluster_before.resources[0].spec.backup.schedule | default([]) }}"

        - name: Patch the cluster to a fast schedule that keeps only a few backups
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
            definition:
              spec:
                backup:
                  schedule:
                    - name: "{{ suite_schedule_name }}"
                      schedule: "{{ suite_fast_schedule }}"
                      keep: "{{ suite_fast_keep }}"
                      storageName: "{{ backup_storage_name }}"
                      type: full

        # Watcher selects percona.com/backup-type=cron and the exact ancestor schedule.
        - name: Watch successful scheduled backups and verify deleted data prefixes
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ role_path }}/files/watch.py"
          environment:
            NS: "{{ mysql_namespace }}"
            CLUSTER: "{{ mysql_cluster_name }}"
            SCHEDULE: "{{ suite_schedule_name }}"
            KEEP: "{{ suite_fast_keep | string }}"
            KUBECONFIG: "{{ kubeconfig_path }}"
            MC_IMAGE: "{{ minio_mc_image }}"
            MC_USER: "{{ minio_root_user }}"
            MC_PASSWORD: "{{ minio_root_password }}"
          register: t06_watch
          changed_when: false

      always:
        - name: Restore the exact prior backup schedule
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
            definition:
              spec:
                backup:
                  schedule: "{{ t06_prior_schedule }}"
          when: t06_prior_schedule is defined

    - name: Record t06 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t06
        scenario_title: Retention prunes scheduled backups down to keep
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ['SCHEDULE=' ~ suite_fast_schedule] + t06_watch.stdout_lines }}"

  rescue:
    - name: Record t06 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t06
        scenario_title: Retention prunes scheduled backups down to keep
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ansible_failed_result.msg | default('see play output') | string | split('\n') }}"

    - name: Fail the play after recording t06
      ansible.builtin.fail:
        msg: "t06 failed: {{ ansible_failed_result.msg | default('see above') }}"
