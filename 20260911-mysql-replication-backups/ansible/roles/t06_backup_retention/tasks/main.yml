---
- name: Start the t06 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - name: Gate on cluster health before t06
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Patch the cluster to a fast schedule that keeps only a few backups
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQL
        namespace: "{{ mysql_namespace }}"
        name: "{{ mysql_cluster_name }}"
        definition:
          spec:
            backup:
              schedule:
                - name: "{{ suite_schedule_name }}"
                  schedule: "{{ suite_fast_schedule }}"
                  keep: "{{ suite_fast_keep }}"
                  storageName: "{{ backup_storage_name }}"
                  type: full

    - name: Watch the cron produce backups and the operator prune them
      # Polling for a count races with the pruning it is trying to observe: a
      # backup can be created and deleted between two polls. So accumulate every
      # distinct scheduled backup seen, and separately record what survives.
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG="{{ kubeconfig_path }}"
        NS="{{ mysql_namespace }}"
        KEEP={{ suite_fast_keep }}
        WANT=$((KEEP + 1))
        list() {
          kubectl -n "$NS" get ps-backup -l percona.com/backup-type=cron \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.percona\.com/backup-ancestor}{"\n"}{end}' \
            | awk -v s="{{ suite_schedule_name }}" '$2 ~ s {print $1}' | sort
        }
        seen=""
        deadline=$(( $(date +%s) + 1500 ))
        while [ "$(date +%s)" -lt "$deadline" ]; do
          cur=$(list)
          for n in $cur; do
            case " $seen " in *" $n "*) ;; *) seen="$seen $n" ;; esac
          done
          n_seen=$(echo $seen | wc -w | tr -d " ")
          n_cur=$(echo $cur | wc -w | tr -d " ")
          if [ "$n_seen" -ge "$WANT" ] && [ "$n_cur" -le "$KEEP" ]; then
            break
          fi
          sleep 10
        done
        surviving=$(list)
        pruned=""
        for n in $seen; do
          case " $surviving " in *" $n "*) ;; *) pruned="$pruned $n" ;; esac
        done
        echo "KEEP=$KEEP"
        echo "PRODUCED_COUNT=$(echo $seen | wc -w | tr -d ' ')"
        echo "PRODUCED=$(echo $seen | tr ' ' ',' | sed 's/^,//')"
        echo "SURVIVING_COUNT=$(echo $surviving | wc -w | tr -d ' ')"
        echo "SURVIVING=$(echo $surviving | tr '\n' ',' | sed 's/,$//')"
        echo "PRUNED=$(echo $pruned | tr ' ' ',' | sed 's/^,//')"
      args:
        executable: /bin/bash
      register: t06_watch
      changed_when: false

    - name: Read the counts back
      ansible.builtin.set_fact:
        t06_produced: >-
          {{ (t06_watch.stdout_lines | select('match', '^PRODUCED_COUNT=') | first).split('=')[1] | int }}
        t06_surviving: >-
          {{ (t06_watch.stdout_lines | select('match', '^SURVIVING_COUNT=') | first).split('=')[1] | int }}
        t06_pruned: >-
          {{ (t06_watch.stdout_lines | select('match', '^PRUNED=') | first).split('=')[1] | trim }}

    - name: List the backup bucket after pruning
      ansible.builtin.include_role:
        name: test_common
        tasks_from: mc.yml
      vars:
        mc_args: "mc ls local/{{ backup_bucket }}/{{ mysql_cluster_name }}"

    - name: Require retention to have pruned down to keep
      ansible.builtin.assert:
        that:
          - (t06_produced | int) > (suite_fast_keep | int)
          - (t06_surviving | int) <= (suite_fast_keep | int)
          - (t06_pruned | length) > 0
        fail_msg: >-
          Retention did not prune: keep={{ suite_fast_keep }}
          produced={{ t06_produced }} surviving={{ t06_surviving }} pruned='{{ t06_pruned }}'

    - name: Record t06 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t06
        scenario_title: Retention prunes scheduled backups down to keep
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: >-
          {{ ['SCHEDULE=' ~ suite_fast_schedule]
             + t06_watch.stdout_lines
             + ['--- ' ~ backup_bucket ~ '/' ~ mysql_cluster_name ~ ' ---']
             + mc_out.stdout_lines }}

  rescue:
    - name: Record t06 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t06
        scenario_title: Retention prunes scheduled backups down to keep
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ansible_failed_result.msg | default('see play output') | string | split('\n') }}"

    - name: Fail the play after recording t06
      ansible.builtin.fail:
        msg: "t06 failed: {{ ansible_failed_result.msg | default('see above') }}"

  always:
    - name: Restore the shipped backup schedule
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQL
        namespace: "{{ mysql_namespace }}"
        name: "{{ mysql_cluster_name }}"
        definition:
          spec:
            backup:
              schedule:
                - name: hourly-full
                  schedule: "{{ backup_schedule }}"
                  keep: "{{ backup_keep }}"
                  storageName: "{{ backup_storage_name }}"
                  type: full
