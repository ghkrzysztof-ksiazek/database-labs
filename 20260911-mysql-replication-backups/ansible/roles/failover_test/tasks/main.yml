---
- name: Snapshot topology before failover
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ kubeconfig_path }}"
    NS="{{ mysql_namespace }}"
    echo "=== BEFORE ==="
    kubectl -n "$NS" get ps {{ mysql_cluster_name }} -o yaml | sed -n '/^status:/,$p' | head -80
    pods=$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance={{ mysql_cluster_name }},app.kubernetes.io/component=database \
      -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
    primary=""
    for p in $pods; do
      ro=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e "SELECT @@read_only" | tr -d '\r')
      host=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e "SELECT @@hostname" | tr -d '\r')
      echo "POD $p hostname=$host read_only=$ro"
      if [ "$ro" = "0" ]; then
        primary="$p"
      fi
    done
    echo "PRIMARY_BEFORE=$primary"
    echo "$primary" > /tmp/mysql-lab-primary-before
  args:
    executable: /bin/bash
  register: before
  changed_when: false

- name: Show before topology
  ansible.builtin.debug:
    var: before.stdout_lines

- name: Identify current source pod
  ansible.builtin.set_fact:
    primary_before: "{{ before.stdout_lines | select('match', '^PRIMARY_BEFORE=') | map('regex_replace', '^PRIMARY_BEFORE=', '') | first }}"

- name: Require a writable source before failover
  ansible.builtin.assert:
    that:
      - primary_before | length > 0
    fail_msg: "Could not find a writable source. {{ before.stdout }}"

- name: Make the current source unavailable (force-delete the primary pod)
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - -n
      - "{{ mysql_namespace }}"
      - delete
      - pod
      - "{{ primary_before }}"
      - --force
      - --grace-period=0
      - --wait=false

- name: Ask Orchestrator to recover the dead source
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - -n
      - "{{ mysql_namespace }}"
      - exec
      - lab-orc-0
      - -c
      - orchestrator
      - --
      - curl
      - -sS
      - "http://127.0.0.1:3000/api/recover/{{ primary_before }}.{{ mysql_cluster_name }}-mysql.{{ mysql_namespace }}/3306"
  register: orc_recover
  failed_when: false
  changed_when: true

- name: Wait for Orchestrator to elect a new writable source
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ kubeconfig_path }}"
    NS="{{ mysql_namespace }}"
    OLD="{{ primary_before }}"
    for i in $(seq 1 60); do
      pods=$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance={{ mysql_cluster_name }},app.kubernetes.io/component=database \
        --field-selector=status.phase=Running \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true)
      primary=""
      replica_ok=0
      echo "=== poll $i ==="
      for p in $pods; do
        [ "$p" = "$OLD" ] && continue
        ro=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e "SELECT @@read_only" 2>/dev/null | tr -d '\r' || true)
        echo "POD $p read_only=$ro"
        if [ "$ro" = "0" ]; then
          primary="$p"
        elif [ "$ro" = "1" ]; then
          io=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e \
            "SELECT SERVICE_STATE FROM performance_schema.replication_connection_status LIMIT 1" 2>/dev/null | tr -d '\r' || true)
          sql=$(kubectl -n "$NS" exec "$p" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e \
            "SELECT SERVICE_STATE FROM performance_schema.replication_applier_status LIMIT 1" 2>/dev/null | tr -d '\r' || true)
          echo "POD $p replica_io=$io replica_sql=$sql"
          if [ "$io" = "ON" ] && [ "$sql" = "ON" ]; then
            replica_ok=$((replica_ok+1))
          fi
        fi
      done
      if [ -n "$primary" ] && [ "$primary" != "$OLD" ]; then
        echo "PRIMARY_AFTER=$primary"
        echo "REPLICA_OK=$replica_ok"
        exit 0
      fi
      sleep 5
    done
    echo "FAILOVER_TIMEOUT"
    exit 1
  args:
    executable: /bin/bash
  register: after
  changed_when: false

- name: Show after topology
  ansible.builtin.debug:
    var: after.stdout_lines

- name: Parse failover result
  ansible.builtin.set_fact:
    primary_after: "{{ after.stdout_lines | select('match', '^PRIMARY_AFTER=') | map('regex_replace', '^PRIMARY_AFTER=', '') | first }}"

- name: Require a different writable source after failover
  ansible.builtin.assert:
    that:
      - primary_after | length > 0
      - primary_after != primary_before
    fail_msg: "Failover did not promote a replica. {{ after.stdout }}"

- name: Wait for the former source (or another replica) to follow the new source
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ kubeconfig_path }}"
    NS="{{ mysql_namespace }}"
    OLD="{{ primary_before }}"
    NEW="{{ primary_after }}"
    mysql() {
      kubectl -n "$NS" exec "$1" -c mysql -- mysql -uroot -p{{ mysql_root_password }} -N -e "$2" 2>/dev/null | tr -d '\r' || true
    }
    for i in $(seq 1 60); do
      echo "=== rejoin poll $i ==="
      phase=$(kubectl -n "$NS" get pod "$OLD" -o jsonpath='{.status.phase}' 2>/dev/null || echo Missing)
      echo "OLD_POD=$OLD phase=$phase"
      if [ "$phase" != "Running" ]; then
        sleep 5
        continue
      fi
      ro=$(mysql "$OLD" "SELECT @@read_only")
      io=$(mysql "$OLD" "SELECT SERVICE_STATE FROM performance_schema.replication_connection_status LIMIT 1")
      sql=$(mysql "$OLD" "SELECT SERVICE_STATE FROM performance_schema.replication_applier_status LIMIT 1")
      src=$(mysql "$OLD" "SELECT HOST FROM performance_schema.replication_connection_configuration LIMIT 1")
      echo "OLD_READ_ONLY=$ro"
      echo "OLD_REPLICA_IO=$io"
      echo "OLD_REPLICA_SQL=$sql"
      echo "OLD_SOURCE_HOST=$src"
      followers=0
      pods=$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance={{ mysql_cluster_name }},app.kubernetes.io/component=database \
        --field-selector=status.phase=Running \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true)
      for p in $pods; do
        [ "$p" = "$NEW" ] && continue
        pro=$(mysql "$p" "SELECT @@read_only")
        pio=$(mysql "$p" "SELECT SERVICE_STATE FROM performance_schema.replication_connection_status LIMIT 1")
        psql=$(mysql "$p" "SELECT SERVICE_STATE FROM performance_schema.replication_applier_status LIMIT 1")
        psrc=$(mysql "$p" "SELECT HOST FROM performance_schema.replication_connection_configuration LIMIT 1")
        echo "FOLLOWER $p read_only=$pro replica_io=$pio replica_sql=$psql source=$psrc"
        if [ "$pro" = "1" ] && [ "$pio" = "ON" ] && [ "$psql" = "ON" ] && echo "$psrc" | grep -q "$NEW"; then
          followers=$((followers+1))
        fi
      done
      echo "FOLLOWERS_OK=$followers"
      if [ "$ro" = "1" ] && [ "$io" = "ON" ] && [ "$sql" = "ON" ] && echo "$src" | grep -q "$NEW"; then
        echo "REJOIN_OK=1"
        exit 0
      fi
      sleep 5
    done
    echo "REJOIN_TIMEOUT"
    echo "REJOIN_OK=0"
    exit 1
  args:
    executable: /bin/bash
  register: rejoin
  changed_when: false

- name: Show rejoin topology
  ansible.builtin.debug:
    var: rejoin.stdout_lines

- name: Require the former source follows the new writable source
  ansible.builtin.assert:
    that:
      - "'REJOIN_OK=1' in rejoin.stdout"
      - "'OLD_READ_ONLY=1' in rejoin.stdout"
      - "'OLD_REPLICA_IO=ON' in rejoin.stdout"
      - "'OLD_REPLICA_SQL=ON' in rejoin.stdout"
      - ("OLD_SOURCE_HOST=" ~ primary_after) in rejoin.stdout
    fail_msg: "Former source did not rejoin as a replica of {{ primary_after }}. {{ rejoin.stdout }}"
