---
- name: Start the t11 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - name: Gate on cluster health before t11
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Require a base backup to aim before
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLBackup
        namespace: "{{ mysql_namespace }}"
        name: t09-base
      register: t11_base
      failed_when: (t11_base.resources | default([]) | length) == 0

    - name: Remove any stale t11 restore object
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLRestore
        namespace: "{{ mysql_namespace }}"
        name: t11-restore
        wait: true
        wait_timeout: 180

    - name: Ask for recovery to a point long before the backup existed
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: ps.percona.com/v1
          kind: PerconaServerMySQLRestore
          metadata:
            name: t11-restore
            namespace: "{{ mysql_namespace }}"
          spec:
            clusterName: "{{ mysql_cluster_name }}"
            backupName: t09-base
            pitr:
              type: date
              date: "2001-01-01T00:00:00"
              backupSource:
                binlogServer:
                  image: "{{ binlog_server_image }}"
                  # A literal int: the CRD types serverId as integer, and a
                  # templated "{{ }}" reaches the API server as a string.
                  # Must not collide with the cluster binlog server (1001).
                  serverId: 1013
                  storage:
                    s3:
                      bucket: "{{ binlog_bucket }}"
                      credentialsSecret: "{{ minio_credentials_secret }}"
                      endpointUrl: "http://minio.{{ mysql_namespace }}.svc.cluster.local:9000"
                      region: us-east-1
                      prefix: "{{ binlog_prefix }}"

    - name: Wait for the operator to reject or fail the impossible restore
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLRestore
        namespace: "{{ mysql_namespace }}"
        name: t11-restore
      register: t11_rst
      until:
        - t11_rst.resources | length == 1
        - (t11_rst.resources[0].status.state | default('') | lower) in ['failed', 'error']
      retries: 60
      delay: 15

    - name: Require a clean, explained failure
      ansible.builtin.assert:
        that:
          - (t11_rst.resources[0].status.state | default('') | lower) in ['failed', 'error']
          - (t11_rst.resources[0].status.stateDescription | default('') | length) > 0
        fail_msg: >-
          An impossible PITR target did not fail cleanly: {{ t11_rst.resources[0].status | default({}) }}

    - name: Keep the failure evidence before deleting the object
      ansible.builtin.set_fact:
        t11_state: "{{ t11_rst.resources[0].status.state }}"
        t11_reason: "{{ t11_rst.resources[0].status.stateDescription | default('n/a') }}"

    - name: Delete the failed restore object so it cannot block later work
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: ps.percona.com/v1
        kind: PerconaServerMySQLRestore
        namespace: "{{ mysql_namespace }}"
        name: t11-restore
        wait: true
        wait_timeout: 180

    - name: Gate on cluster health after the failed restore
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Confirm the data is untouched
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG="{{ kubeconfig_path }}"
        kubectl -n {{ mysql_namespace }} exec {{ mysql_cluster_name }}-mysql-0 -c mysql -- \
          mysql -uroot -p{{ mysql_root_password }} -N -e \
          "SELECT CONCAT('TABLES_AFTER_FAILED_RESTORE=', COUNT(*)) FROM information_schema.tables
             WHERE table_schema='{{ sysbench_database }}' AND table_name LIKE 'sbtest%';" | tr -d '\r'
      args:
        executable: /bin/bash
      register: t11_after
      changed_when: false
      retries: 20
      delay: 15
      until: t11_after.rc == 0

    - name: Require the dataset to have survived
      ansible.builtin.assert:
        that:
          - ('TABLES_AFTER_FAILED_RESTORE=' ~ sysbench_tables) in t11_after.stdout
        fail_msg: "A failed restore damaged the cluster: {{ t11_after.stdout }}"

    - name: Record t11 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t11
        scenario_title: An impossible recovery target fails cleanly
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: >-
          {{ ['PITR_TYPE=date', 'PITR_TARGET=2001-01-01T00:00:00 (valid format, before any backup or binlog existed)']
             + ['RESTORE_STATE=' ~ t11_state]
             + ['RESTORE_REASON=' ~ t11_reason]
             + t11_after.stdout_lines
             + ['HEALTH=' ~ health_summary] }}

  rescue:
    - name: Record t11 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t11
        scenario_title: An impossible recovery target fails cleanly
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ansible_failed_result.msg | default('see play output') | string | split('\n') }}"

    - name: Fail the play after recording t11
      ansible.builtin.fail:
        msg: "t11 failed: {{ ansible_failed_result.msg | default('see above') }}"
