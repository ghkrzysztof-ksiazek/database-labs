---
- name: Start the t04 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - name: Gate on cluster health before t04
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Verify backup chunks and prove binlog byte growth after controlled writes
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/probe.py"
      environment:
        NS: "{{ mysql_namespace }}"
        CLUSTER: "{{ mysql_cluster_name }}"
        KUBECONFIG: "{{ kubeconfig_path }}"
        MC_IMAGE: "{{ minio_mc_image }}"
        MC_USER: "{{ minio_root_user }}"
        MC_PASSWORD: "{{ minio_root_password }}"
        MYSQL_PASSWORD: "{{ mysql_root_password }}"
        DATABASE: "{{ sysbench_database }}"
        BINLOG_BUCKET: "{{ binlog_bucket }}"
        BINLOG_PREFIX: "{{ binlog_prefix }}"
      register: t04_probe
      changed_when: true

    - name: Gate on cluster health after t04
      ansible.builtin.include_role:
        name: test_common
        tasks_from: health_gate.yml

    - name: Record t04 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t04
        scenario_title: Backup and binlog objects present in MinIO
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ t04_probe.stdout_lines }}"

  rescue:
    - name: Record t04 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t04
        scenario_title: Backup and binlog objects present in MinIO
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: >-
          {{ [ansible_failed_result.msg | default('see play output') | string]
             + (ansible_failed_result.stdout_lines | default([]))
             + (ansible_failed_result.stderr_lines | default([])) }}

    - name: Fail the play after recording t04
      ansible.builtin.fail:
        msg: "t04 failed: {{ ansible_failed_result.msg | default('see above') }}"
