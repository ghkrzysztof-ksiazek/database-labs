---
- name: Start the t05 clock
  ansible.builtin.set_fact:
    t_start: "{{ lookup('pipe', 'date -u +%s') }}"

- block:
    - block:
        - name: Gate on cluster health before t05
          ansible.builtin.include_role:
            name: test_common
            tasks_from: health_gate.yml

        - name: Save the actual backup schedule before testing
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
          register: t05_cluster_before

        - name: Preserve the prior backup schedule
          ansible.builtin.set_fact:
            t05_prior_schedule: "{{ t05_cluster_before.resources[0].spec.backup.schedule | default([]) }}"

        - name: Note the scheduled backups that already exist
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQLBackup
            namespace: "{{ mysql_namespace }}"
            label_selectors:
              - percona.com/backup-type=cron
          register: t05_before

        - name: Remember their names
          ansible.builtin.set_fact:
            t05_seen_before: "{{ t05_before.resources | default([]) | map(attribute='metadata.name') | list }}"

        - name: Patch the cluster to a fast backup schedule
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
            definition:
              spec:
                backup:
                  schedule:
                    - name: "{{ suite_schedule_name }}"
                      schedule: "{{ suite_fast_schedule }}"
                      keep: "{{ backup_keep }}"
                      storageName: "{{ backup_storage_name }}"
                      type: full

        - name: Wait for a new successful backup of the exact cluster and schedule
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ role_path }}/files/watch.py"
          environment:
            KUBECONFIG: "{{ kubeconfig_path }}"
            NS: "{{ mysql_namespace }}"
            CLUSTER: "{{ mysql_cluster_name }}"
            SCHEDULE: "{{ suite_schedule_name }}"
            SEEN: "{{ t05_seen_before | to_json }}"
          register: t05_watch
          changed_when: false

      always:
        - name: Restore the exact prior backup schedule
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: ps.percona.com/v1
            kind: PerconaServerMySQL
            namespace: "{{ mysql_namespace }}"
            name: "{{ mysql_cluster_name }}"
            definition:
              spec:
                backup:
                  schedule: "{{ t05_prior_schedule }}"
          when: t05_prior_schedule is defined

    - name: Record t05 as passed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t05
        scenario_title: Scheduled backup runs unattended
        scenario_status: passed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ['SCHEDULE_PATCHED=' ~ suite_fast_schedule ~ ' name=' ~ suite_schedule_name, 'PRE_EXISTING_CRON_BACKUPS=' ~ (t05_seen_before | length)] + t05_watch.stdout_lines }}"

  rescue:
    - name: Record t05 as failed
      ansible.builtin.include_role:
        name: test_common
        tasks_from: record_result.yml
      vars:
        scenario_id: t05
        scenario_title: Scheduled backup runs unattended
        scenario_status: failed
        scenario_started: "{{ t_start }}"
        scenario_evidence: "{{ ansible_failed_result.msg | default('see play output') | string | split('\n') }}"

    - name: Fail the play after recording t05
      ansible.builtin.fail:
        msg: "t05 failed: {{ ansible_failed_result.msg | default('see above') }}"
