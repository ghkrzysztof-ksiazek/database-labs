---
- name: Deploy localhost MySQL replication lab
  hosts: localhost
  gather_facts: true
  vars:
    kubeconfig_path: "{{ (playbook_dir ~ '/../..') | realpath }}/.kube/config"
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ lookup('env', 'PATH') }}"
    KUBECONFIG: "{{ (playbook_dir ~ '/../..') | realpath }}/.kube/config"
  roles:
    - prereqs
    - kind_cluster
    - mysql_operator
    - minio
    - mysql_cluster
    - monitoring
