---
- name: Record sysbench row counts before backup
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ mysql_namespace }}"
    pod: "{{ mysql_cluster_name }}-mysql-0"
    container: mysql
    command: >
      mysql -uroot -p{{ mysql_root_password }} -N -e "SELECT table_name, table_rows FROM information_schema.tables
      WHERE table_schema='{{ sysbench_database }}' AND table_name LIKE 'sbtest%'
      ORDER BY table_name"
  register: rows_before
  failed_when: false

- name: Show pre-backup row counts
  ansible.builtin.debug:
    var: rows_before.stdout_lines

- name: Delete previous on-demand backup object if present
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: ps.percona.com/v1
    kind: PerconaServerMySQLBackup
    namespace: "{{ mysql_namespace }}"
    name: lab-ondemand
    wait: true
    wait_timeout: 60

- name: Render on-demand backup manifest
  ansible.builtin.template:
    src: backup.yaml.j2
    dest: "{{ repo_root }}/k8s/backup/ondemand.yaml"
    mode: "0644"

- name: Apply on-demand backup
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ repo_root }}/k8s/backup/ondemand.yaml"

- name: Wait for backup to succeed
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: ps.percona.com/v1
    kind: PerconaServerMySQLBackup
    namespace: "{{ mysql_namespace }}"
    name: lab-ondemand
  register: bkp
  until:
    - bkp.resources | length == 1
    - (bkp.resources[0].status.state | default('') | lower) in ['succeeded', 'ready', 'done']
      or (bkp.resources[0].status.state | default('') | lower) in ['failed', 'error']
  retries: 90
  delay: 10

- name: Require backup success
  ansible.builtin.assert:
    that:
      - (bkp.resources[0].status.state | default('') | lower) in ['succeeded', 'ready', 'done']
    fail_msg: "Backup did not succeed: {{ bkp.resources[0].status | default({}) }}"

- name: Show backup destination
  ansible.builtin.debug:
    msg: "{{ bkp.resources[0].status }}"
