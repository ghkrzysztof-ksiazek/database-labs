---
apiVersion: v1
kind: Service
metadata:
  name: mysql-primary-nodeport
  namespace: mysql
  labels:
    app: mysql-lab
spec:
  type: NodePort
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30306
  selector:
    app.kubernetes.io/instance: lab
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: percona-server-mysql-operator
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-metrics
  namespace: mysql
  labels:
    app: mysql-metrics
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9104
      targetPort: 9104
  selector:
    app.kubernetes.io/instance: lab
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: percona-server-mysql-operator
