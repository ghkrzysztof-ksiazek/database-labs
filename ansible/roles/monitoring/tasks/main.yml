---
- name: Ensure monitoring namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"

- name: Render kube-prometheus-stack values
  ansible.builtin.template:
    src: kube-prometheus-values.yaml.j2
    dest: "{{ repo_root }}/k8s/monitoring/kube-prometheus-values.yaml"
    mode: "0644"

- name: Render ServiceMonitors, alerts, and Grafana dashboard
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ repo_root }}/k8s/monitoring/{{ item | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop:
    - servicemonitors.yaml.j2
    - prometheus-rules.yaml.j2
    - keeper-metrics-service.yaml.j2
    - grafana-dashboard.yaml.j2

- name: Add prometheus-community Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
    force_update: true

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: kps
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ kube_prometheus_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "15m0s"
    values_files:
      - "{{ repo_root }}/k8s/monitoring/kube-prometheus-values.yaml"

- name: Apply ClickHouse scrape, alert, and dashboard manifests
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: "{{ repo_root }}/k8s/monitoring/{{ item }}"
  loop:
    - keeper-metrics-service.yaml
    - servicemonitors.yaml
    - prometheus-rules.yaml
    - grafana-dashboard.yaml
